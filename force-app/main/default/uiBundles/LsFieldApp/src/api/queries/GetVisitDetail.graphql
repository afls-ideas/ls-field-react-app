query GetVisitDetail($id: ID) {
  uiapi {
    query {
      Visit(where: { Id: { eq: $id } }, first: 1) {
        edges {
          node {
            Id
            Name @optional { value }
            Status @optional { value }
            Channel @optional { value }
            Call_type__c @optional { value displayValue }
            VisitPriority @optional { value displayValue }
            PlannedVisitStartTime @optional { value }
            PlannedVisitEndTime @optional { value }
            ActualVisitStartTime @optional { value }
            ActualVisitEndTime @optional { value }
            InstructionDescription @optional { value }
            StatusRemarks @optional { value }
            LS_Territory_Name__c @optional { value }
            ContactPointAddress @optional { value }
            AccountId @optional { value }
            PlaceId @optional { value }
            TerritoryId @optional { value }
            Account @optional { Name @optional { value } }
          }
        }
      }
      ProviderVisit(where: { VisitId: { eq: $id } }, first: 1) {
        edges {
          node {
            Id
            Name @optional { value }
            Status @optional { value }
            VisitSubmitDateTime @optional { value }
            PreProviderVisitNotes @optional { value }
          }
        }
      }
      ProviderVisitProdDetailing(where: { VisitId: { eq: $id } }, first: 50, orderBy: { Priority: { order: ASC } }) {
        edges {
          node {
            Id
            Name @optional { value }
            Priority @optional { value }
            ProductId @optional { value }
            Product @optional {
              ... on LifeSciMarketableProduct { Name @optional { value } }
              ... on Product2 { Name @optional { value } }
            }
          }
        }
      }
    }
  }
}
