query GetVisits($after: String, $status: Picklist, $channel: Picklist) {
  uiapi {
    query {
      Visit(after: $after, first: 200, where: { Status: { eq: $status }, Channel: { eq: $channel } }, orderBy: { PlannedVisitStartTime: { order: DESC } }) {
        edges {
          node {
            Id
            Name @optional {
              value
              displayValue
            }
            Status @optional {
              value
              displayValue
            }
            Channel @optional {
              value
              displayValue
            }
            Call_type__c @optional {
              value
              displayValue
            }
            VisitPriority @optional {
              value
              displayValue
            }
            PlannedVisitStartTime @optional {
              value
              displayValue
            }
            ActualVisitStartTime @optional {
              value
              displayValue
            }
            LS_Territory_Name__c @optional {
              value
              displayValue
            }
            StatusRemarks @optional {
              value
              displayValue
            }
            Account {
              Name @optional {
                value
                displayValue
              }
            }
          }
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}
